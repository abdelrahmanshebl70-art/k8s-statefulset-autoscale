apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
 name: myhpa
 namespace: default
spec:
 scaleTargetRef:
  apiVersion: apps/v1
  kind: StatefulSet
  name:  mystate
 minReplicas: 2
 maxReplicas: 3
 metrics:
  - type: Resource
    resource:
     name: cpu
     target:
      type: Utilization
      averageUtilization: 50
